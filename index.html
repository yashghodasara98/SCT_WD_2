<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
    margin:0%;
    padding:0%;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #0a0a0f;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 20% 30%, rgba(91, 79, 255, 0.12) 0%, transparent 60%), radial-gradient(ellipse 40% 40% at 80% 70%, rgba(200, 245, 66, 0.07) 0%, transparent 55%);
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

.container{
    position:relative;
    width: min(520px, 96vw);
    background: #111118;
    padding:10px 20px 20px;
    border-radius:12px;
    border: 1px solid  #2a2a3a;
    z-index:100;
    padding:32px;
}

.display{
    min-height: 130px; 
    width:100%;
    border-radius: 20px;
    background: #16161f;
    margin-bottom:24px;
    font-size: 25px;
    border: 1px solid  #2a2a3a;
    color:white;
    background:#16161f;
    color:#f0f0fa;
    text-align:right;
    padding: 24px 28px 22px;
    gap: 8px;
    pointer-events:none;
    overflow-x: auto;
    overflow-y: hidden;
}

input::placeholder {
  color: #6b6b8a;
  font-size: 13px;
}



.buttons{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    grid-gap: 12px;
}

button{
    height: 84px;
    background:#1c1c28;
    border: 1px solid #2a2a3a;
    color:white;
    border-radius: 14px;
    padding:10px;
    font-size: 20px;
    cursor:pointer;
    transition: 0.2s ease;
}

button:hover{
    border-color: rgba(91,79,255,0.6);

    box-shadow:
        0 0 10px rgba(91,79,255,0.25),
        0 0 20px rgba(91,79,255,0.15);
}

.buttons button:active{
    transform: scale(0.99);
    -webkit-transform: scale(0.99);
    -moz-transform: scale(0.99);
    -ms-transform: scale(0.99);
    -o-transform: scale(0.99);
}

#AC{
    background-color:#2a1a2e ;
    color:#ff6b6b ;
}

.operator{
    background-color:#1e1b38;
    color:#5b4fff;
    
}

#show{
    padding:2px 20px 2px 20px;
    position:absolute;
    top:50px;
    right:40px;          /* match display padding */
    left:28px;           /* add left boundary */

    text-align:right;
    font-size:15px;
    color:white;
    opacity:0.5;

    white-space:nowrap;  /* keep in one line */
    overflow-x:auto;     /* horizontal scroll */
    overflow-y:hidden;

    scrollbar-width:none;
}

#show::-webkit-scrollbar{
    display:none;
}

@media(max-width:768px){
    .container{
        margin-left:5%;
        margin-right: 5%;
    }

    .display{
        max-height: 70px;
    }

    button{
        height: 75px ;
    }
}
  </style>
</head>
<body>
  <div class="container">
    <div class="screen">
    <p id="show"></p>
    <input type="text" class="display">
</div>
    
    <div class="buttons">
      <button id="AC" data-value="AC">AC</button>
      <button data-value="DEL">DEL</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">-</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator"  data-value="+">+</button>

      <button data-value="0">0</button>
      <button data-value="00">00</button>
      <button data-value=".">.</button>
      <button class="operator" data-value="=">=</button>
    </div>
  </div>

  <script>
    const display=document.querySelector('.display');
const buttons=document.querySelectorAll('button');
const specialChars= ["%","÷","*","-","+","="];
let output="";
let show=document.getElementById("show");
buttons.forEach((button)=>{
    button.addEventListener("click",(e)=>calculate(e.target.dataset.value))
})

const calculate = (value) =>{
    if(value ==="=" && output!==""){
        show.innerText=output;
        show.scrollLeft = show.scrollWidth;
        output=eval(output.replace("%","/100"));
    }
    else if(value==="AC"){
        output="";
        show.innerText="";
        show.scrollLeft = 0;
    }
    else if(value==="DEL"){
        output=output.toString().slice(0,-1);
    }
    else{
        if(output ==="" && specialChars.includes(value)) return;
        output+=value;
    }
    output=eval(output.replace("%","/100"));
    show.value=output;
    display.scrollLeft = display.scrollWidth;

};

  </script>

  
</body>
</html>
